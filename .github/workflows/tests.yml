name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      download_benchmarks:
        description: Run the complete loopback performance evidence suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  download-benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.download_benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Measure all unchanged download fixtures and release gates
        run: >-
          python -m regshape.tests.benchmark_downloads
          --samples 20 --warmups 1
          --output "${{ runner.temp }}/download-benchmark.json"
      - name: Retain raw evidence even when a gate fails
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: download-benchmark-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/download-benchmark.json
          if-no-files-found: error
          retention-days: 90

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record offline layout inspection baselines
        if: matrix.python-version == '3.12'
        run: >-
          python -m regshape.tests.benchmark_layout_inspection
          --output "${{ runner.temp }}/layout-inspection-baseline.json"
      - name: Retain Linux layout inspection evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layout-inspection-linux-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/layout-inspection-baseline.json
          if-no-files-found: error
          retention-days: 90
      - name: Run tests
        run: python -m pytest -q

  urllib3-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Install supported legacy transport dependencies
        run: >-
          python -m pip install -e ".[dev]"
          "requests==2.31.0" "urllib3==1.26.20"
      - name: Test bounded receives and transport compatibility
        run: >-
          python -m pytest -q
          src/regshape/tests/test_download_validation.py
          src/regshape/tests/test_blob_batch.py
          src/regshape/tests/test_blob_ranges.py
          src/regshape/tests/test_download_policy.py
          src/regshape/tests/test_download_transport.py
          src/regshape/tests/test_download_coordinator.py
          src/regshape/tests/test_download_workers.py
          src/regshape/tests/test_manifest_download.py
          src/regshape/tests/test_manifest_progress.py
          src/regshape/tests/test_transport_client.py
          src/regshape/tests/test_client_middleware_integration.py
          src/regshape/tests/test_auth_challenge_origin.py
          src/regshape/tests/test_tag_pagination.py
          src/regshape/tests/test_artifact_graph.py
          src/regshape/tests/test_artifact_download.py
          src/regshape/tests/test_component_download.py
          src/regshape/tests/test_artifact_storage.py
          src/regshape/tests/test_artifact_archive.py
          src/regshape/tests/test_artifact_push.py
          src/regshape/tests/test_artifact_pull_cli.py
          src/regshape/tests/test_image_progress.py
          src/regshape/tests/test_layout_push.py

  click-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Install package with the minimum supported Click
        run: python -m pip install -e ".[dev]" "click==8.1.0"
      - name: Test command, progress and parser compatibility
        run: >-
          python -m pytest -q
          src/regshape/tests/test_telemetry_cli.py
          src/regshape/tests/test_download_validation.py
          src/regshape/tests/test_artifact_options.py
          src/regshape/tests/test_component_cli.py
          src/regshape/tests/test_artifact_cli.py
          src/regshape/tests/test_artifact_pull_cli.py
          src/regshape/tests/test_refs.py
          src/regshape/tests/test_manifest_cli.py
          src/regshape/tests/test_manifest_cli_progress.py
          src/regshape/tests/test_progress_display.py
          src/regshape/tests/test_blob_cli.py
          src/regshape/tests/test_layout_cli.py
          src/regshape/tests/test_layout_inspect_cli.py
          src/regshape/tests/test_layout_inspection_integration.py
          src/regshape/tests/test_artifact_graph.py
          src/regshape/tests/test_artifact_download.py
          src/regshape/tests/test_artifact_archive.py
          src/regshape/tests/test_artifact_push.py
          src/regshape/tests/test_layout_push.py
          src/regshape/tests/test_image_progress.py
          src/regshape/tests/test_docker_cli.py

  artifact-filesystem:
    name: artifact-filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test native safety boundaries and unsupported-platform guards
        run: >-
          python -m pytest -q
          src/regshape/tests/test_download_validation.py
          src/regshape/tests/test_blob_batch.py
          src/regshape/tests/test_blob_ranges.py
          src/regshape/tests/test_download_coordinator.py
          src/regshape/tests/test_download_workers.py
          src/regshape/tests/test_artifact_storage.py
          src/regshape/tests/test_artifact_download.py
          src/regshape/tests/test_component_download.py
          src/regshape/tests/test_component_cli.py
          src/regshape/tests/test_artifact_namespace.py
          src/regshape/tests/test_artifact_archive.py
          src/regshape/tests/test_artifact_push.py
          src/regshape/tests/test_layout_push.py
          src/regshape/tests/test_artifact_pull_cli.py
          src/regshape/tests/test_layout_inspection.py
          src/regshape/tests/test_layout_inspect_cli.py
      - name: Test native interleaved progress and deferred warnings
        run: >-
          python -m pytest -q
          src/regshape/tests/test_progress_display.py
          src/regshape/tests/test_blob_cli.py
          -k "interleaved or completed_history or real_download or changed_etag"
      - name: Test all-view inspection rejection on Windows
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q
          src/regshape/tests/test_layout_inspection_integration.py
          -k unsupported_platform
