name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  urllib3-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Install supported legacy transport dependencies
        run: >-
          python -m pip install -e ".[dev]"
          "requests==2.31.0" "urllib3==1.26.20"
      - name: Test bounded receives and transport compatibility
        run: >-
          python -m pytest -q
          src/regshape/tests/test_manifest_download.py
          src/regshape/tests/test_manifest_progress.py
          src/regshape/tests/test_transport_client.py
          src/regshape/tests/test_client_middleware_integration.py
          src/regshape/tests/test_tag_pagination.py
          src/regshape/tests/test_artifact_graph.py
          src/regshape/tests/test_artifact_storage.py

  click-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Install package with the minimum supported Click
        run: python -m pip install -e ".[dev]" "click==8.1.0"
      - name: Test command, progress and parser compatibility
        run: >-
          python -m pytest -q
          src/regshape/tests/test_artifact_options.py
          src/regshape/tests/test_artifact_cli.py
          src/regshape/tests/test_refs.py
          src/regshape/tests/test_manifest_cli.py
          src/regshape/tests/test_manifest_cli_progress.py
          src/regshape/tests/test_layout_cli.py
          src/regshape/tests/test_artifact_graph.py

  artifact-filesystem:
    name: artifact-filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test native safety boundaries and unsupported-platform guards
        run: >-
          python -m pytest -q
          src/regshape/tests/test_artifact_storage.py
          src/regshape/tests/test_artifact_namespace.py
